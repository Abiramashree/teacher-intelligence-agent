# Full open-source demo stack: Ollama (local models) + the Streamlit app.
#
#   docker compose up --build
#   # one-time, in another terminal, pull the model into the ollama container:
#   docker compose exec ollama ollama pull llama3.1:8b
#
# Then open http://localhost:8501
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      SUMMARY_MODEL: llama3.1:8b
      AGENT_MODEL: llama3.1:8b
    depends_on:
      - ollama

volumes:
  ollama:
